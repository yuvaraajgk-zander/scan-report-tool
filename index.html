<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Report Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="vendor/docx.umd.js"></script>
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#3D4C6B; --muted:#5B6B87;
    --page:#F4F6F9; --card:#FFFFFF; --line:#E2E7EF;
    --accent:#1B5FCC; --header-bg:#1B2A4A;
    --ok:#1C8C6B; --warn:#B8790A;
  }
  *{box-sizing:border-box}
  body{background:var(--page);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;margin:0;padding:28px 20px 80px}

  .toolbar{max-width:880px;margin:0 auto 20px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(27,42,74,.08)}
  .toolbar label{font-size:12px;color:var(--muted);font-weight:600}
  .toolbar input[type=text]{font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;width:130px}
  .toolbar select{font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px}
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn:hover{opacity:.9}
  .btn.secondary{background:var(--card);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  .toolbar .status{font-size:12px;color:var(--muted);margin-left:auto}
  .toolbar .status.error{color:#C0392B}
  .edit-hint{max-width:880px;margin:0 auto 14px;font-size:12px;color:var(--muted);padding:0 4px}

  .sheet{max-width:880px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(27,42,74,.08);padding:36px 44px 44px}
  .sheet[contenteditable="true"]{outline:none}
  .sheet[contenteditable="true"] *:hover{outline:1px dashed var(--accent);outline-offset:2px;cursor:text}

  .letterhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;margin-bottom:18px;border-bottom:3px solid var(--accent)}
  .brand-logo{height:42px;width:auto;display:block}
  .doc-date{font-size:13px;color:var(--ink-soft)}
  .doc-date b{color:var(--ink)}

  h1{font-size:26px;font-weight:700;margin:0 0 8px;color:var(--ink)}
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0 0 22px}

  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px}
  .stat{border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center}
  .stat .v{font-weight:700;font-size:13px;color:var(--accent);line-height:1.25;word-break:break-word}
  .stat .l{font-size:8.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em}

  ul.bullets{margin:0 0 28px;padding-left:20px;font-size:13.5px;color:var(--ink-soft);line-height:1.9}
  ul.bullets b{color:var(--ink)}

  h2{font-size:18px;font-weight:700;color:var(--ink);margin:0 0 12px}

  .table-wrap{overflow-x:auto;margin-bottom:26px}
  table{border-collapse:collapse;width:100%;min-width:320px;font-size:11px}
  thead th{background:var(--header-bg);color:#fff;text-align:left;padding:6px 8px;font-weight:600;white-space:nowrap}
  thead th:not(:first-child):not(:nth-child(2)){text-align:right}
  tbody td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td:not(:first-child):not(:nth-child(2)){text-align:right}
  tbody tr:nth-child(even){background:var(--page)}
  tr.total td{font-weight:700;border-top:2px solid var(--ink);background:var(--page)}

  .workload{display:flex;gap:14px;margin-bottom:28px}
  .wl-box{flex:1;border:1px solid var(--line);border-radius:6px;padding:14px 16px}
  .wl-box .l{font-size:10.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .wl-box .id{font-weight:700;color:var(--accent);font-size:16px;margin-top:6px}
  .wl-box .sub{font-size:13px;color:var(--ink-soft)}

  .config{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .cfg{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .cfg .l{font-size:10px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .cfg .v{font-weight:600;font-size:13.5px;margin-top:4px}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

  .empty-state{max-width:620px;margin:60px auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
  .empty-state code{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12.5px;color:var(--ink-soft)}

  @media(max-width:640px){ .stats{grid-template-columns:repeat(3,1fr)} .workload,.config{grid-template-columns:1fr;display:block} .workload .wl-box{margin-bottom:10px} }

  /* ===== Weekly report ===== */
  .wk-page{max-width:880px;margin:0 auto 28px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(27,42,74,.08);padding:36px 44px 44px}
  .wk-page[contenteditable="true"] *:hover{outline:1px dashed var(--accent);outline-offset:2px;cursor:text}
  .wk-eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--accent);margin-bottom:6px}
  .wk-kpis{display:grid;gap:10px;margin-bottom:14px}
  .wk-kpis.n4{grid-template-columns:repeat(4,1fr)}
  .wk-kpis.n2{grid-template-columns:repeat(2,1fr);max-width:460px}
  .wk-kpi{background:var(--header-bg);border-radius:6px;padding:14px 14px 12px;color:#fff}
  .wk-kpi .v{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .wk-kpi .l{font-size:11px;font-weight:600;margin-top:5px;color:#C7D2E8}
  .wk-kpi .s{font-size:9.5px;color:#7E8CAC;margin-top:2px}
  .wk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .wk-stats.n3{grid-template-columns:repeat(3,1fr);max-width:560px}
  .wk-stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;border-left:3px solid var(--accent)}
  .wk-stat .v{font-size:16px;font-weight:700;color:var(--accent)}
  .wk-stat .l{font-size:10px;color:var(--ink-soft);font-weight:600;margin-top:2px}
  .wk-stat .s{font-size:9px;color:var(--muted)}
  .wk-sec-note{font-size:11.5px;color:var(--muted);margin:0 0 10px}
  .wk-table-block table{border-collapse:collapse;width:100%;font-size:11.5px}
  .wk-table-title{background:var(--header-bg);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:6px 10px;border-radius:5px 5px 0 0}
  .wk-table-block table{border:1px solid var(--line);border-top:none}
  .wk-table-block thead th{background:var(--header-bg);color:#fff;text-align:left;padding:6px 10px;font-weight:700;font-size:10px;white-space:nowrap}
  .wk-table-block thead th:not(:nth-child(1)):not(:nth-child(2)){text-align:right}
  .wk-table-block tbody td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink-soft)}
  .wk-table-block td.wk-wrap{white-space:normal;max-width:260px;line-height:1.4}
  .wk-table-block tbody td:not(:nth-child(1)):not(:nth-child(2)){text-align:right}
  .wk-table-block tbody tr:nth-child(even){background:var(--page)}
  .wk-rank{color:var(--accent);font-weight:700}
  .wk-name{color:var(--ink);font-weight:600}
  .wk-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .wk-boxes{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin:14px 0 4px}
  .wk-box{border:1px solid var(--line);border-radius:6px;padding:14px 16px}
  .wk-box-title{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:8px}
  .wk-kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
  .wk-kv:last-child{border-bottom:none}
  .wk-kv .l{color:var(--muted)}
  .wk-kv .v{font-weight:700;color:var(--ink)}
  .wk-chart{border:1px solid var(--line);border-radius:6px;padding:16px 18px 12px;margin-bottom:16px}
  .wk-bars{display:flex;align-items:flex-end;gap:12px;height:130px;margin-top:6px}
  .wk-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
  .wk-bar-num{font-size:10.5px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .wk-bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent)}
  .wk-bar.peak{background:var(--header-bg)}
  .wk-bar-label{font-size:9.5px;color:var(--ink-soft);font-weight:700;margin-top:6px}
  .wk-bar-sub{font-size:8.5px;color:var(--muted)}
  .wk-banner{background:var(--header-bg);color:#fff;border-radius:6px;padding:12px 18px;margin-top:14px;font-size:11.5px;line-height:1.6}
  .wk-banner .tag{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#8FB0FF;margin-bottom:4px}
  .wk-banner b{color:#fff}
  .wk-h1{font-size:24px;font-weight:700;margin:0 0 8px;color:var(--ink)}
  .wk-subtitle{color:var(--ink-soft);font-size:13px;margin:0 0 18px;line-height:1.55}
  .wk-h2{font-size:16px;font-weight:700;color:var(--ink);margin:22px 0 3px}

  @media(max-width:640px){ .wk-kpis.n4,.wk-stats{grid-template-columns:repeat(2,1fr)} .wk-split,.wk-boxes{grid-template-columns:1fr} }
</style>
</head>
<body>

  <div class="toolbar">
    <label for="reportMode">Report</label>
    <select id="reportMode">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
    </select>
    <label for="fetchDate">Date</label>
    <input type="text" id="fetchDate" placeholder="DD-MM-YYYY" />
    <button class="btn" id="fetchData">Get Data</button>
    <span style="color:var(--line)">|</span>
    <label for="csvFile" class="btn secondary" style="margin:0">Open CSV</label>
    <input type="file" id="csvFile" accept=".csv,text/csv" style="display:none" />
    <span id="fileName" style="font-size:12.5px;color:var(--muted)"></span>
    <button class="btn" id="download" disabled>Download PDF</button>
    <button class="btn secondary" id="downloadDocx" disabled>Download DOCX</button>
    <span class="status" id="status"></span>
  </div>
  <p class="edit-hint" id="editHint" style="display:none">Click any value or label in the report below to edit it directly — your edits are included in the downloaded PDF.</p>

  <div id="emptyState" class="empty-state">For weekly reports, pick a date and the report covers the 7 days ending on it.</div>
  <div id="sheet" class="sheet" contenteditable="false" style="display:none"></div>

<script>

  return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Splits one CSV line into fields, honoring double-quoted fields that
// contain commas or escaped ("") quotes.
function parseCsvLine(line) {
  const fields = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { fields.push(cur); cur = ''; }
    else cur += c;
  }
  fields.push(cur);
  return fields;
}

const PICKLIST_HEADER_MAP = {
  'Picklist Number': 'picklistNumber', 'Line items': 'lineItems', 'Total Unit': 'totalUnit',
  'Scan Time': 'scanTime', 'Line item/ Min': 'itemsPerMin', 'units/ min': 'unitsPerMin',
};
const SCANNER_HEADER_MAP = {
  'Scanner name': 'scannerName', 'Checker name': 'checkerName', 'Total Units': 'totalUnits',
  'Line Items': 'lineItems', 'Scan Time': 'scanTime', 'Units / Min': 'unitsPerMin', 'Line Items / Min': 'itemsPerMin',
};
const NUMERIC_PICKLIST_FIELDS = ['lineItems', 'totalUnit', 'itemsPerMin', 'unitsPerMin'];
const NUMERIC_SCANNER_FIELDS = ['totalUnits', 'lineItems', 'unitsPerMin', 'itemsPerMin'];
const STRING_KV_FIELDS = new Set(['reportDate', 'schema', 'activeScanTime', 'largestPicklistNumber', 'mostLineItemsPicklistNumber']);

// Rebuilds the same shape server.js's buildReport() returns, by reading the
// "SECTION,<name>" markers server.js's reportToCsv() wrote.
function parseReportCsv(text) {
  const lines = text.split(/\r\n|\n/).filter((l) => l.length > 0);
  const meta = {}, summary = {}, coverage = {}, workload = {};
  const picklists = [], scannerMetrics = [];
  let section = null, header = null;

  for (const line of lines) {
    const fields = parseCsvLine(line);
    if (fields[0] === 'SECTION') { section = fields[1]; header = null; continue; }
    if (!section) continue;

    if (section === 'PICKLIST_DETAILS' || section === 'SCANNER_METRICS') {
      if (!header) { header = fields; continue; }
      const map = section === 'PICKLIST_DETAILS' ? PICKLIST_HEADER_MAP : SCANNER_HEADER_MAP;
      const numeric = section === 'PICKLIST_DETAILS' ? NUMERIC_PICKLIST_FIELDS : NUMERIC_SCANNER_FIELDS;
      const row = {};
      header.forEach((h, i) => {
        const key = map[h];
        if (key) row[key] = numeric.includes(key) ? Number(fields[i]) : fields[i];
      });
      (section === 'PICKLIST_DETAILS' ? picklists : scannerMetrics).push(row);
      continue;
    }

    if (fields[0] === 'key' && fields[1] === 'value') continue;
    const [key, value] = fields;
    const target = { META: meta, SUMMARY: summary, COVERAGE: coverage, WORKLOAD: workload }[section];
    if (target) target[key] = STRING_KV_FIELDS.has(key) ? value : Number(value);
  }

  if (picklists.length === 0 && scannerMetrics.length === 0 && !meta.reportDate) {
    throw new Error('This file doesn\'t look like a scan report CSV.');
  }

  return {
    reportDate: meta.reportDate,
    schema: meta.schema,
    summary,
    picklists,
    scannerMetrics,
    coverage,
    workload: {
      largestPicklist: workload.largestPicklistNumber
        ? { picklistNumber: workload.largestPicklistNumber, units: workload.largestPicklistUnits } : null,
      mostLineItems: workload.mostLineItemsPicklistNumber
        ? { picklistNumber: workload.mostLineItemsPicklistNumber, lineItems: workload.mostLineItemsCount } : null,
    },
  };
}

      Bench: 'label', 'Total lines': 'lines', 'Avg lines/checker/day': 'avgLinesPerDay',
      'Total units': 'units', 'Avg units/checker/day': 'avgUnitsPerDay', 'Share of lines': 'shareOfLines',
    },

  },
  FASTEST_CHECKERS: {
    target: 'fastestCheckers',
    map: { Checker: 'checkerName', Days: 'days', 'Items/min': 'itemsPerMin', 'Units/min': 'unitsPerMin' },
    numeric: ['days', 'itemsPerMin', 'unitsPerMin'],
  },
  HIGHEST_VOLUME_CHECKERS: {
    target: 'highestVolumeCheckers',
    map: {
      Checker: 'checkerName', Days: 'days', Lines: 'lines', Units: 'units',
      'Lines/day': 'linesPerDay', MRP: 'mrp', 'Active scan time': 'activeScanTime',
    },
    numeric: ['days', 'lines', 'units', 'linesPerDay', 'mrp'],
  },
};
const WK_STRING_KV = new Set([
  'reportDate', 'schema', 'weekStart', 'weekEnd', 'highestItemsPicklist', 'highestUnitsPicklist',
  'operatingWindowOpen', 'operatingWindowClose', 'date', 'bestLineDayDate', 'bestLineDayChecker',
  'bestUnitDayDate', 'bestUnitDayChecker',
]);

// Rebuilds the same shape server.js's buildWeeklyReport() returns, from
// the "SECTION,<name>" CSV reportToWeeklyCsv() wrote.
function parseWeeklyReportCsv(text) {
  const lines = text.split(/\r\n|\n/).filter((l) => l.length > 0);
  const meta = {}, summary = {}, highestDay = {}, checkerSummary = {}, coverage = {};
  const tables = {};
  for (const key of Object.keys(WK_TABLE_SECTIONS)) tables[WK_TABLE_SECTIONS[key].target] = [];

  let section = null, header = null;
  for (const line of lines) {
    const fields = parseCsvLine(line);
    if (fields[0] === 'SECTION') { section = fields[1]; header = null; continue; }
    if (!section) continue;

    const tableSpec = WK_TABLE_SECTIONS[section];
    if (tableSpec) {
      if (!header) { header = fields; continue; }
      const row = {};
      header.forEach((h, i) => {
        const key = tableSpec.map[h];
        if (key) row[key] = tableSpec.numeric.includes(key) ? Number(fields[i]) : fields[i];
      });
      tables[tableSpec.target].push(row);
      continue;
    }

    if (fields[0] === 'key' && fields[1] === 'value') continue;
    const [key, value] = fields;
    const kvTarget = { META: meta, SUMMARY: summary, HIGHEST_DAY: highestDay, CHECKER_SUMMARY: checkerSummary, COVERAGE: coverage }[section];
    if (kvTarget) kvTarget[key] = WK_STRING_KV.has(key) ? value : Number(value);
  }

  if (!meta.weekStart) throw new Error('This file doesn\'t look like a weekly scan report CSV.');

  return {
    reportDate: meta.reportDate,
    schema: meta.schema,
    weekStart: meta.weekStart,
    weekEnd: meta.weekEnd,
    summary,
    highestDay: highestDay.date ? highestDay : null,
    ...tables,
    checkerSummary: {
      checkersSeen: checkerSummary.checkersSeen,
      presentAllDays: checkerSummary.presentAllDays,
      avgLinesPerCheckerDay: checkerSummary.avgLinesPerCheckerDay,
      avgUnitsPerCheckerDay: checkerSummary.avgUnitsPerCheckerDay,
      bestLineDayChecker: checkerSummary.bestLineDayChecker
        ? { date: checkerSummary.bestLineDayDate, checkerName: checkerSummary.bestLineDayChecker, lines: checkerSummary.bestLineDayLines } : null,
      bestUnitDayChecker: checkerSummary.bestUnitDayChecker
        ? { date: checkerSummary.bestUnitDayDate, checkerName: checkerSummary.bestUnitDayChecker, units: checkerSummary.bestUnitDayUnits } : null,
    },
    coverage,
  };
}

function indFmt(n) {
  const num = Math.round(Number(n) || 0);
  const s = String(Math.abs(num));
  let out;
  if (s.length <= 3) out = s;
  else {
    const last3 = s.slice(-3);
    let rest = s.slice(0, -3);
    const parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) parts.unshift(rest);
    out = parts.join(',') + ',' + last3;
  }
  return num < 0 ? '-' + out : out;
}
function fmtDayShort(iso) {
  if (!iso) return '';
  const d = new Date(`${iso}T00:00:00Z`);
  return `${d.getUTCDate()} ${d.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' })}`;
}
// Cr only once a value actually crosses into crore territory (>=99,99,999,
// i.e. 1 crore) - a small branch's MRP showing "₹0.01 Cr" is silly.
// Below that, pick whichever of lakh/thousand actually fits the value.
function crFmt(n) {
  const v = Number(n || 0);
  if (v >= 9999999) return `₹${(v / 10000000).toFixed(2)} Cr`;
  if (v >= 100000) return `₹${(v / 100000).toFixed(2)} L`;
  return `₹${(v / 1000).toFixed(2)} K`;
}
// Only show "X.XX lakh" once the value actually crosses 99,999 - a small
// branch's totals showing "0.00 lakh" is meaningless; below that, just
// show the plain Indian-grouped number.
function lakhFmt(n) {
  const v = Number(n || 0);
  if (v >= 100000) return `${(v / 100000).toFixed(2)} lakh`;
  return indFmt(v);
}

// Generic ranked-or-plain table: one full-width table for a small row
// count, or two side-by-side tables once there are enough rows to be
// worth splitting - the same adaptive rule the data layer uses for which
// sections exist at all, applied here to how they're laid out.
function wkTable(rows, columns, opts = {}) {
  if (!rows || rows.length === 0) return `<p class="wk-sec-note">No data for this period.</p>`;
  const headCells = (opts.rank ? '<th>Rank</th>' : '') + columns.map((c) => `<th>${esc(c.header)}</th>`).join('');
  const rowHtml = (row, idx) => {
    const rankCell = opts.rank ? `<td class="wk-rank">${String(idx + 1).padStart(2, '0')}</td>` : '';
    const cells = columns.map((c) => `<td class="${c.cls || ''}">${c.render ? c.render(row) : esc(row[c.key])}</td>`).join('');
    return `<tr>${rankCell}${cells}</tr>`;
  };
  const bodyFor = (subset, offset) => subset.map((row, i) => rowHtml(row, offset + i)).join('');

  if (opts.noSplit || rows.length <= 8) {
    return `<div class="wk-table-block"><div class="table-wrap"><table><thead><tr>${headCells}</tr></thead><tbody>${bodyFor(rows, 0)}</tbody></table></div></div>`;
  }
  const half = Math.ceil(rows.length / 2);
  const firstTitle = opts.rank ? `RANKS 01–${String(half).padStart(2, '0')}` : `1–${half}`;
  const secondTitle = opts.rank ? `RANKS ${String(half + 1).padStart(2, '0')}–${String(rows.length).padStart(2, '0')}` : `${half + 1}–${rows.length}`;
  return `<div class="wk-split">
    <div class="wk-table-block"><div class="wk-table-title">${firstTitle}</div><div class="table-wrap"><table><thead><tr>${headCells}</tr></thead><tbody>${bodyFor(rows.slice(0, half), 0)}</tbody></table></div></div>
    <div class="wk-table-block"><div class="wk-table-title">${secondTitle}</div><div class="table-wrap"><table><thead><tr>${headCells}</tr></thead><tbody>${bodyFor(rows.slice(half), half)}</tbody></table></div></div>
  </div>`;
}

  return `<div class="letterhead"><img class="brand-logo" src="${ZANDER_LOGO_SRC}" alt="Zander"><div class="doc-date"><b>Date:</b> ${esc(r.reportDate)}</div></div>`;
}

        { header: 'Checker', key: 'checkerName', cls: 'wk-name' },
        { header: 'Days', key: 'days' },
        { header: 'Lines', key: 'lines', render: (c) => indFmt(c.lines) },
        { header: 'Units', key: 'units', render: (c) => indFmt(c.units) },
        { header: 'Lines/day', key: 'linesPerDay', render: (c) => indFmt(c.linesPerDay) },
        { header: 'MRP', key: 'mrp', render: (c) => crFmt(c.mrp) },
        { header: 'Active scan time', key: 'activeScanTime' },
      ], { rank: true, noSplit: true })}
    </div>`;
  }

  return out;
}

let loadedReportDate = null;
let currentReportKind = 'daily'; // drives which renderer/PDF exporter downloadPdf() uses
let loadedDailyData = null;

function showReport(data) {
  currentReportKind = 'daily';
  loadedReportDate = data.reportDate;
  loadedDailyData = data;
  sheetEl.innerHTML = renderReport(data);
  sheetEl.style.display = 'block';
  sheetEl.setAttribute('contenteditable', 'true');
  emptyEl.style.display = 'none';
  editHint.style.display = 'block';
  downloadBtn.disabled = false;
  downloadDocxBtn.disabled = false;
  setStatus(`Loaded ${data.summary.picklists} picklist(s) for ${data.reportDate}.`);
}

let loadedWeeklyData = null;

function showWeeklyReport(data) {
  currentReportKind = 'weekly';
  loadedReportDate = `${data.weekStart}_to_${data.weekEnd}`;
  loadedWeeklyData = data;
  sheetEl.innerHTML = renderWeeklyReport(data);
  sheetEl.style.display = 'block';
  sheetEl.setAttribute('contenteditable', 'true');
  emptyEl.style.display = 'none';
  editHint.style.display = 'block';
  downloadBtn.disabled = false;
  downloadDocxBtn.disabled = false;
  setStatus(`Loaded week ${data.weekStart} to ${data.weekEnd} (${data.summary.operationalDays} operational day(s)).`);
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('fileName').textContent = file.name;
  setStatus('Reading file…');
  downloadBtn.disabled = true;
  downloadDocxBtn.disabled = true;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      // Detect the report type from the file's own content rather than
      // trusting the Report dropdown, which can easily be left on the
      // wrong setting - a weekly CSV run through the daily parser is
      // missing fields the daily renderer expects and crashes instead of
      // showing anything useful.
      const isWeekly = /SECTION,HIGHEST_DAY|\nweekStart,/.test(reader.result);
      document.getElementById('reportMode').value = isWeekly ? 'weekly' : 'daily';
      if (isWeekly) showWeeklyReport(parseWeeklyReportCsv(reader.result));
      else showReport(parseReportCsv(reader.result));
    } catch (err) {
      setStatus(err.message, true);
    }
  };
  reader.onerror = () => setStatus('Could not read file.', true);
  reader.readAsText(file);
}

// Only works when this page is being served BY server.js itself
// (http://localhost:<port>/) - then this is a same-origin request, no CORS
// or mixed-content issues. Opened as a local file (file://) or from the
// GitHub Pages copy, there's no server behind '/api/report' to answer this,
// so it fails - the CSV-upload path above is what covers those cases.
async function fetchFromServer() {
  const date = document.getElementById('fetchDate').value.trim();
  const mode = document.getElementById('reportMode').value;
  const endpoint = mode === 'weekly' ? '/api/report/weekly' : '/api/report';
  setStatus('Fetching…');
  downloadBtn.disabled = true;
  downloadDocxBtn.disabled = true;
  try {
    const res = await fetch(`${endpoint}${date ? '?date=' + encodeURIComponent(date) : ''}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    document.getElementById('fileName').textContent = '';
    if (mode === 'weekly') showWeeklyReport(data);
    else showReport(data);
  } catch (err) {
    setStatus('Could not reach the server (this only works when the page is opened via server.js, not as a local file or on GitHub Pages).', true);
  }
}

// html2pdf.js's own pagination just slices the rendered canvas into fixed-
// height chunks with no idea where a table row ends, so a row near a page
// boundary gets sliced in half - and its CSS-based "avoid" heuristic turned
// out to still miscount on a 500+ row table (verified: row 253 came out
// split across two pages even with page-break-inside:avoid set). Instead,
// this renders the whole report once as a single tall canvas, measures the
// real on-screen top/bottom of every row-like element (table rows, stat
// tiles, workload/config cards, bullets), and only ever cuts a page between
// two of those elements - never inside one. That holds regardless of how
// many rows there are or how tall any one row renders.
const ATOMIC_SELECTOR = 'tr, .stat, .wl-box, .cfg, ul.bullets li, .letterhead';
const PAGE_MM = { width: 210, height: 297, margin: 10 };

async function exportSheetAsPdf(filename) {
  const sheetRect = sheetEl.getBoundingClientRect();
  const contentWidthMM = PAGE_MM.width - PAGE_MM.margin * 2;
  const usableHeightMM = PAGE_MM.height - PAGE_MM.margin * 2;
  const pxPerMM = sheetRect.width / contentWidthMM;
  const usablePageHeightPx = usableHeightMM * pxPerMM;

  const atoms = Array.from(sheetEl.querySelectorAll(ATOMIC_SELECTOR)).map((el) => {
    const r = el.getBoundingClientRect();
    return { top: r.top - sheetRect.top, bottom: r.bottom - sheetRect.top };
  });

  const sheetHeightPx = sheetEl.scrollHeight;
  const breaks = [0];
  let cursor = 0;
  while (cursor < sheetHeightPx - 1) {
    let next = Math.min(cursor + usablePageHeightPx, sheetHeightPx);
    if (next < sheetHeightPx) {
      const straddler = atoms.find((a) => a.top < next && next < a.bottom);
      if (straddler && straddler.top > cursor) next = straddler.top;
    }
    if (next <= cursor) next = Math.min(cursor + usablePageHeightPx, sheetHeightPx);
    breaks.push(next);
    cursor = next;
  }

  const canvas = await html2canvas(sheetEl, { scale: 2 });
  const pxScale = canvas.width / sheetRect.width;

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  for (let i = 0; i < breaks.length - 1; i++) {
    const sliceTopPx = breaks[i] * pxScale;
    const sliceHeightPx = Math.round((breaks[i + 1] - breaks[i]) * pxScale);
    if (sliceHeightPx <= 0) continue;

    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceHeightPx;
    pageCanvas.getContext('2d').drawImage(
      canvas, 0, sliceTopPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx,
    );

    if (i > 0) pdf.addPage();
    const sliceHeightMM = (breaks[i + 1] - breaks[i]) / pxPerMM;
    pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', PAGE_MM.margin, PAGE_MM.margin, contentWidthMM, sliceHeightMM);
  }

  pdf.save(filename);
}

// Weekly export: multiple `.wk-page` sections, each of which may itself
// span more than one physical page, with the SAME header (real logo) and
// footer repeated on every output page - not baked into the HTML content
// flow (which would only show it once per section), but drawn directly by
// jsPDF so it appears on every page regardless of how a section splits.
// Uses the same "never cut a row/card in half" measurement approach as
// exportSheetAsPdf above, applied once per `.wk-page`.
const WK_LOGO_ASPECT = 4059 / 1223;
const WK_ATOMIC_SELECTOR = 'tr, .wk-stat, .wk-kpi, .wk-box, .wk-chart, li, .wk-banner';

function drawWeeklyHeader(pdf, pageW, marginX, dateLabel) {
  const top = 20, logoH = 22;
  pdf.addImage(ZANDER_LOGO_SRC, 'PNG', marginX, top, logoH * WK_LOGO_ASPECT, logoH);
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(9);
  pdf.setTextColor(0x3D, 0x4C, 0x66);
  pdf.text(`Date: ${dateLabel}`, pageW - marginX, top + logoH / 2 + 3, { align: 'right' });
  pdf.setDrawColor(0x1B, 0x5F, 0xCC);
  pdf.setLineWidth(1.4);
  pdf.line(marginX, top + logoH + 10, pageW - marginX, top + logoH + 10);
}

function drawWeeklyFooter(pdf, pageW, pageH, marginX, rightLabel) {
  const y = pageH - 34;
  pdf.setDrawColor(0xE2, 0xE7, 0xF0);
  pdf.setLineWidth(0.75);
  pdf.line(marginX, y, pageW - marginX, y);
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(7.5);
  pdf.setTextColor(0x5B, 0x6B, 0x87);
  pdf.text('Zander · Supply Chain Intelligence', marginX, pageH - 22);
  pdf.text(rightLabel, pageW - marginX, pageH - 22, { align: 'right' });
}

async function exportWeeklyPdf(filename) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait' });
  const PW = pdf.internal.pageSize.getWidth();
  const PH = pdf.internal.pageSize.getHeight();

  const HEADER_TOP = 20, HEADER_H = 42, GAP = 14, FOOTER_ZONE = 40;
  const CONTENT_TOP = HEADER_TOP + HEADER_H + GAP;
  const CONTENT_H = PH - CONTENT_TOP - FOOTER_ZONE;

  const dateLabel = loadedWeeklyData ? loadedWeeklyData.reportDate : '';
  const footerLabel = loadedWeeklyData ? `Weekly Scan Report | ${loadedWeeklyData.weekStart} to ${loadedWeeklyData.weekEnd}` : 'Weekly Scan Report';

  const pageEls = Array.from(document.querySelectorAll('.wk-page'));
  const prevStyles = pageEls.map((el) => ({ border: el.style.border, shadow: el.style.boxShadow }));
  pageEls.forEach((el) => { el.style.border = 'none'; el.style.boxShadow = 'none'; });
  let isFirstOutputPage = true;

  try {
  for (const pageEl of pageEls) {
    const letterhead = pageEl.querySelector('.letterhead');
    const prevDisplay = letterhead ? letterhead.style.display : null;
    if (letterhead) letterhead.style.display = 'none';

    const rect = pageEl.getBoundingClientRect();
    const sheetWidthPx = rect.width;
    const marginX = 44 * (PW / sheetWidthPx);

    const atoms = Array.from(pageEl.querySelectorAll(WK_ATOMIC_SELECTOR)).map((el) => {
      const r = el.getBoundingClientRect();
      return { top: r.top - rect.top, bottom: r.bottom - rect.top };
    });

    const canvas = await html2canvas(pageEl, { scale: 2 });
    if (letterhead) letterhead.style.display = prevDisplay;

    const pxScale = canvas.width / sheetWidthPx;
    const pageHeightImg = sheetWidthPx * (CONTENT_H / PW) * pxScale;
    const atomsImg = atoms.map((a) => ({ top: a.top * pxScale, bottom: a.bottom * pxScale }));

    const breaks = [0];
    let cursor = 0;
    while (cursor < canvas.height - 1) {
      let target = Math.min(cursor + pageHeightImg, canvas.height);
      if (target < canvas.height) {
        const straddler = atomsImg.find((a) => a.top < target && target < a.bottom && a.top > cursor);
        if (straddler) target = straddler.top;
      }
      if (target <= cursor) target = Math.min(cursor + pageHeightImg, canvas.height);
      breaks.push(target);
      cursor = target;
    }
    if (breaks.length > 2) {
      const lastH = breaks[breaks.length - 1] - breaks[breaks.length - 2];
      const prevH = breaks[breaks.length - 2] - breaks[breaks.length - 3];
      if (lastH < 0.2 * pageHeightImg && (prevH + lastH) <= 1.25 * pageHeightImg) breaks.splice(-2, 1);
    }

    for (let i = 0; i < breaks.length - 1; i++) {
      const top = breaks[i], bottom = breaks[i + 1];
      const sliceH = Math.max(1, Math.round(bottom - top));
      const chunkCanvas = document.createElement('canvas');
      chunkCanvas.width = canvas.width;
      chunkCanvas.height = sliceH;
      chunkCanvas.getContext('2d').drawImage(canvas, 0, Math.round(top), canvas.width, sliceH, 0, 0, canvas.width, sliceH);

      let renderW, renderH;
      if ((canvas.width / sliceH) >= (PW / CONTENT_H)) { renderW = PW; renderH = (PW * sliceH) / canvas.width; }
      else { renderH = CONTENT_H; renderW = (CONTENT_H * canvas.width) / sliceH; }
      const xStart = (PW - renderW) / 2;

      if (!isFirstOutputPage) pdf.addPage();
      isFirstOutputPage = false;

      pdf.addImage(chunkCanvas.toDataURL('image/jpeg', 0.85), 'JPEG', xStart, CONTENT_TOP, renderW, renderH);
      drawWeeklyHeader(pdf, PW, marginX, dateLabel);
      drawWeeklyFooter(pdf, PW, PH, marginX, footerLabel);
    }
  }
  } finally {
    pageEls.forEach((el, i) => { el.style.border = prevStyles[i].border; el.style.boxShadow = prevStyles[i].shadow; });
  }

  pdf.save(filename);
}

async function downloadPdf() {
  // Turn editing off just for the capture so the export doesn't include
  // a lingering caret/focus outline, then restore it right after.
  sheetEl.setAttribute('contenteditable', 'false');
  document.activeElement && document.activeElement.blur();
  const dateLabel = (loadedReportDate || 'today').replace(/[^0-9A-Za-z-]/g, '_');

  if (currentReportKind === 'weekly') {
    try {
      await exportWeeklyPdf(`scan-report-weekly-${dateLabel}.pdf`);
    } finally {
      sheetEl.setAttribute('contenteditable', 'true');
    }
    return;
  }

  // Daily: drop the card border/shadow too - a screen-only affordance to
  // separate the sheet from the page background, which html2canvas would
  // otherwise bake into the page as a visible line along the top/left edge.
  const prevBorder = sheetEl.style.border;
  const prevShadow = sheetEl.style.boxShadow;
  sheetEl.style.border = 'none';
  sheetEl.style.boxShadow = 'none';
  try {
    await exportSheetAsPdf(`scan-report-${dateLabel}.pdf`);
  } finally {
    sheetEl.style.border = prevBorder;
    sheetEl.style.boxShadow = prevShadow;
    sheetEl.setAttribute('contenteditable', 'true');
  }
}

// DOCX export: builds a real, natively-editable Word document (headings,
// paragraphs, tables) directly from the report data object - the same `r`
// the HTML renderer uses - instead of a picture of the rendered page. The
// on-screen layout leans on flexbox/grid throughout, which Word's HTML
// importer doesn't support, so a from-markup document is the only route to
// clean, editable output. Visuals with no native Word equivalent (bar
// charts) are rebuilt with shaded/nested tables - a real proportional bar
// via table-column width, not a raster image - so everything stays text
// and tables a user can edit like any other Word document.
function triggerBlobDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function docxLogoBytes() {
  const base64 = ZANDER_LOGO_SRC.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

const DX = {
  ink: '1B2A4A', inkSoft: '3D4C6B', muted: '5B6B87',
  accent: '1B5FCC', headerBg: '1B2A4A', line: 'E2E7EF', page: 'F4F6F9',
  white: 'FFFFFF', kpiLabel: 'C7D2E8', kpiSub: '7E8CAC', bannerTag: '8FB0FF',
};

function dxBorder(color, size) { return { style: docx.BorderStyle.SINGLE, size: size || 4, color }; }
function dxAllBorders(color, size) { const b = dxBorder(color, size); return { top: b, bottom: b, left: b, right: b }; }
// Same-color-as-page borders between adjacent shaded cells, standing in for
// the CSS grid `gap` these cards use on screen - Word tables have no native
// cell-gap concept, so a page-colored border fakes the visual separation.
function dxGapBorders() { return dxAllBorders(DX.page, 16); }
function dxCellMargins(v) { return { top: v || 100, bottom: v || 100, left: v || 140, right: v || 140 }; }

function dxPara(text, opts = {}) {
  return new docx.Paragraph({
    alignment: opts.align,
    spacing: opts.spacing,
    bullet: opts.bullet,
    children: [new docx.TextRun({
      text, bold: !!opts.bold, color: opts.color || DX.ink, size: opts.size || 20,
    })],
  });
}

function dxRuns(segments, opts = {}) {
  return new docx.Paragraph({
    alignment: opts.align,
    spacing: opts.spacing,
    bullet: opts.bullet,
    children: segments.map((s) => new docx.TextRun({
      text: s.text, bold: !!s.bold, color: s.color || opts.color || DX.white, size: opts.size || 17,
    })),
  });
}

function dxBullet(segments) {
  return dxRuns(segments, { color: DX.inkSoft, size: 19, spacing: { after: 80 }, bullet: { level: 0 } });
}

function dxHeaderBlock(dateLabel) {
  const logoW = 118, logoH = Math.round(logoW / WK_LOGO_ASPECT);
  return new docx.Paragraph({
    tabStops: [{ type: docx.TabStopType.RIGHT, position: docx.TabStopPosition.MAX }],
    border: { bottom: { style: docx.BorderStyle.SINGLE, size: 20, color: DX.accent } },
    spacing: { after: 260 },
    children: [
      new docx.ImageRun({ data: docxLogoBytes(), type: 'png', transformation: { width: logoW, height: logoH } }),
      new docx.TextRun({ text: `\tDate: ${dateLabel}`, color: DX.inkSoft, size: 18 }),
    ],
  });
}

function dxSectionHeading(eyebrow, title, subtitle) {
  const out = [];
  if (eyebrow) out.push(dxPara(eyebrow, { bold: true, color: DX.accent, size: 15, spacing: { after: 60 } }));
  out.push(dxPara(title, { bold: true, color: DX.ink, size: 34, spacing: { after: 80 } }));
  if (subtitle) out.push(dxPara(subtitle, { color: DX.inkSoft, size: 20, spacing: { after: 220 } }));
  return out;
}

function dxH2(text) { return dxPara(text, { bold: true, color: DX.ink, size: 25, spacing: { before: 260, after: 100 } }); }
function dxSecNote(text) { return dxPara(text, { color: DX.muted, size: 16, spacing: { after: 140 } }); }
function dxGap(after) { return new docx.Paragraph({ spacing: { after: after || 160 } }); }
function dxPageBreak() { return new docx.Paragraph({ children: [new docx.PageBreak()] }); }

function dxKpiRow(items) {
  if (items.length === 0) return dxGap(0);
  const cells = items.map((it) => new docx.TableCell({
    width: { size: Math.floor(100 / items.length), type: docx.WidthType.PERCENTAGE },
    shading: { fill: DX.headerBg },
    borders: dxGapBorders(),
    margins: dxCellMargins(160),
    children: [
      dxPara(it.value, { bold: true, color: DX.white, size: 30, spacing: { after: 40 } }),
      dxPara(it.label, { bold: true, color: DX.kpiLabel, size: 15, spacing: it.sub ? { after: 20 } : undefined }),
      ...(it.sub ? [dxPara(it.sub, { color: DX.kpiSub, size: 13 })] : []),
    ],
  }));
  return new docx.Table({ rows: [new docx.TableRow({ children: cells })], width: { size: 100, type: docx.WidthType.PERCENTAGE } });
}

function dxStatRow(items) {
  const cells = items.map((it) => new docx.TableCell({
    width: { size: Math.floor(100 / items.length), type: docx.WidthType.PERCENTAGE },
    borders: { top: dxBorder(DX.line, 4), bottom: dxBorder(DX.line, 4), right: dxBorder(DX.line, 4), left: dxBorder(DX.accent, 20) },
    margins: dxCellMargins(140),
    children: [
      dxPara(it.value, { bold: true, color: DX.accent, size: 23, spacing: { after: 30 } }),
      dxPara(it.label, { bold: true, color: DX.inkSoft, size: 14, spacing: it.sub ? { after: 20 } : undefined }),
      ...(it.sub ? [dxPara(it.sub, { color: DX.muted, size: 13 })] : []),
    ],
  }));
  return new docx.Table({ rows: [new docx.TableRow({ children: cells })], width: { size: 100, type: docx.WidthType.PERCENTAGE } });
}

// Small centered bordered box (daily report's `.stat` tiles) - distinct
// from the left-accent `.wk-stat` tiles the weekly report uses.
function dxStatBoxRow(items) {
  const cells = items.map((it) => new docx.TableCell({
    width: { size: Math.floor(100 / items.length), type: docx.WidthType.PERCENTAGE },
    borders: dxAllBorders(DX.line, 4),
    margins: dxCellMargins(110),
    children: [
      dxPara(it.value, { bold: true, color: DX.accent, size: 17, align: docx.AlignmentType.CENTER, spacing: { after: 30 } }),
      dxPara(it.label, { color: DX.muted, size: 12, align: docx.AlignmentType.CENTER }),
    ],
  }));
  return new docx.Table({ rows: [new docx.TableRow({ children: cells })], width: { size: 100, type: docx.WidthType.PERCENTAGE } });
}

// Label-above-value bordered box (daily report's Workload/Session boxes).
function dxLabelValueRow(items) {
  const cells = items.map((it) => new docx.TableCell({
    width: { size: Math.floor(100 / items.length), type: docx.WidthType.PERCENTAGE },
    borders: dxAllBorders(DX.line, 4),
    margins: dxCellMargins(140),
    children: [
      dxPara(it.label, { color: DX.muted, size: 14 }),
      dxPara(it.value, { bold: true, color: it.accent ? DX.accent : DX.ink, size: 19, spacing: { before: 60, after: it.sub ? 20 : 0 } }),
      ...(it.sub ? [dxPara(it.sub, { color: DX.inkSoft, size: 15 })] : []),
    ],
  }));
  return new docx.Table({ rows: [new docx.TableRow({ children: cells })], width: { size: 100, type: docx.WidthType.PERCENTAGE } });
}

// Reuses the exact same `columns` shape (header + optional render(row)) the
// on-screen wkTable() calls already define, so the DOCX and HTML/PDF
// renderers can't silently drift apart - both read the same column specs.
function dxTable(rows, columns, opts = {}) {
  if (!rows || rows.length === 0) return [dxSecNote('No data for this period.')];
  const rightFrom = opts.rightAlignFrom != null ? opts.rightAlignFrom : 2;
  const headers = (opts.rank ? ['#'] : []).concat(columns.map((c) => c.header));
  const bodyRows = rows.map((row, idx) => (
    (opts.rank ? [opts.padRank === false ? String(idx + 1) : String(idx + 1).padStart(2, '0')] : [])
      .concat(columns.map((c) => (c.render ? c.render(row) : row[c.key])))
  ));
  const headerRow = new docx.TableRow({
    tableHeader: true,
    children: headers.map((h, i) => new docx.TableCell({
      shading: { fill: DX.headerBg },
      borders: dxAllBorders(DX.line, 4),
      margins: dxCellMargins(),
      children: [dxPara(String(h), { bold: true, color: DX.white, size: 15, align: i >= rightFrom ? docx.AlignmentType.RIGHT : docx.AlignmentType.LEFT })],
    })),
  });
  const dataRows = bodyRows.map((r) => new docx.TableRow({
    children: r.map((val, ci) => new docx.TableCell({
      borders: dxAllBorders(DX.line, 4),
      margins: dxCellMargins(),
      children: [dxPara(String(val), {
        color: ci === 0 ? DX.ink : DX.inkSoft,
        bold: ci === 0,
        size: 17,
        align: ci >= rightFrom ? docx.AlignmentType.RIGHT : docx.AlignmentType.LEFT,
      })],
    })),
  }));
  return [new docx.Table({ rows: [headerRow, ...dataRows], width: { size: 100, type: docx.WidthType.PERCENTAGE } })];
}

function dxBanner(tag, segments) {
  return new docx.Table({
    rows: [new docx.TableRow({ children: [new docx.TableCell({
      shading: { fill: DX.headerBg },
      margins: dxCellMargins(180),
      children: [
        dxPara(tag, { bold: true, color: DX.bannerTag, size: 15, spacing: { after: 70 } }),
        dxRuns(segments, { size: 18 }),
      ],
    })] })],
    width: { size: 100, type: docx.WidthType.PERCENTAGE },
  });
}

// Horizontal bar "chart": each row's colored fraction is a nested 1-row
// table whose lead cell is sized to value/max as a real column-width
// percentage - a genuine proportional bar (not an image), the same trick
// the on-screen version does with a CSS div width, expressed as a table
// width instead so it survives into a native Word document.
function dxBarChart(items) {
  const maxV = Math.max(1, ...items.map((it) => it.value));
  const rows = items.map((it) => {
    const pct = Math.max(6, Math.round((it.value / maxV) * 100));
    const barCells = [new docx.TableCell({
      width: { size: pct, type: docx.WidthType.PERCENTAGE },
      shading: { fill: it.peak ? DX.headerBg : DX.accent },
      margins: dxCellMargins(90),
      children: [dxPara(it.valueLabel, { bold: true, color: DX.white, size: 15 })],
    })];
    if (pct < 100) barCells.push(new docx.TableCell({ width: { size: 100 - pct, type: docx.WidthType.PERCENTAGE }, children: [dxPara('', {})] }));
    const bar = new docx.Table({ rows: [new docx.TableRow({ children: barCells })], width: { size: 100, type: docx.WidthType.PERCENTAGE } });
    return new docx.TableRow({ children: [
      new docx.TableCell({
        width: { size: 20, type: docx.WidthType.PERCENTAGE },
        children: [
          dxPara(it.label, { bold: true, color: DX.ink, size: 15 }),
          ...(it.sub ? [dxPara(it.sub, { color: DX.muted, size: 13 })] : []),
        ],
      }),
      new docx.TableCell({ width: { size: 80, type: docx.WidthType.PERCENTAGE }, children: [bar] }),
    ] });
  });
  return new docx.Table({ rows, width: { size: 100, type: docx.WidthType.PERCENTAGE } });
}

function dxFooter(left, right) {
  return new docx.Paragraph({
    tabStops: [{ type: docx.TabStopType.RIGHT, position: docx.TabStopPosition.MAX }],
    border: { top: { style: docx.BorderStyle.SINGLE, size: 6, color: DX.line } },
    spacing: { before: 300 },
    children: [new docx.TextRun({ text: left, color: DX.muted, size: 15 }), new docx.TextRun({ text: `\t${right}`, color: DX.muted, size: 15 })],
  });
}

function buildWeeklyDocxSections(r) {
  const s = r.summary;
  const weekLabel = `${fmtDayShort(r.weekStart)} – ${fmtDayShort(r.weekEnd)}`;
  const daysByDate = [...r.daysRankedByLines].sort((a, b) => a.date.localeCompare(b.date));
  const out = [];

  // Page 1: Weekly Overview
  out.push(dxHeaderBlock(r.reportDate));
  out.push(...dxSectionHeading(
    'OPERATIONS REPORT · WEEKLY',
    `Weekly Scan Report for ${r.schema} - ${weekLabel}`,
    `Outbound checking across all picklists this week.${r.highestDay ? ` Highest day is ${indFmt(r.highestDay.lines)} lines on ${fmtDayShort(r.highestDay.date)},` : ''} across ${s.operationalDays} operational day(s).`,
  ));
  out.push(dxKpiRow([
    { value: r.highestDay ? indFmt(r.highestDay.lines) : '-', label: "Highest day's lines", sub: r.highestDay ? fmtDayShort(r.highestDay.date) : '' },
    { value: indFmt(s.avgLinesPerDay), label: 'Average lines / day', sub: `${s.operationalDays} operating days` },
    { value: r.highestDay ? indFmt(r.highestDay.units) : '-', label: "Highest day's units", sub: r.highestDay ? fmtDayShort(r.highestDay.date) : '' },
    { value: indFmt(s.avgUnitsPerDay), label: 'Average units / day', sub: `${s.operationalDays} operating days` },
  ]));
  out.push(dxGap());
  out.push(dxKpiRow([
    { value: String(s.highestItemsPerMin), label: 'Highest lines / min', sub: `Single fastest picklist${s.highestItemsPicklist ? ', GP ' + s.highestItemsPicklist : ''}` },
    { value: String(s.highestUnitsPerMin), label: 'Highest units / min', sub: `Single fastest picklist${s.highestUnitsPicklist ? ', GP ' + s.highestUnitsPicklist : ''}` },
  ]));
  out.push(dxGap());
  out.push(dxStatRow([
    { value: String(s.operationalDays), label: 'Operational days' },
    { value: lakhFmt(s.totalLines), label: 'Lines this week', sub: indFmt(s.totalLines) },
    { value: lakhFmt(s.totalUnits), label: 'Units this week', sub: indFmt(s.totalUnits) },
    { value: crFmt(s.totalMrp), label: 'MRP value' },
  ]));
  out.push(dxGap());
  out.push(dxStatRow([
    { value: String(s.avgCheckersPerDay), label: 'Avg checkers on floor' },
    { value: String(s.activeScanners), label: 'Active scanners' },
    { value: indFmt(s.totalTrays), label: 'Trays / GPs' },
    { value: String(s.avgLinesPerTray), label: 'Avg lines / tray', sub: `${s.avgUnitsPerTray} units / tray` },
  ]));
  out.push(dxH2('Daily line-item volume'));
  out.push(dxSecNote(`All ${daysByDate.length} operating day(s) this week. Bar length reflects lines checked that day.`));
  const maxDayLines = Math.max(1, ...daysByDate.map((d) => d.lines));
  out.push(dxBarChart(daysByDate.map((d) => ({
    label: fmtDayShort(d.date), sub: `${indFmt(d.units)} u`, value: d.lines, valueLabel: indFmt(d.lines), peak: d.lines === maxDayLines,
  }))));
  out.push(dxH2('Days ranked by lines'));
  out.push(...dxTable(r.daysRankedByLines, [
    { header: 'Day', render: (d) => fmtDayShort(d.date) },
    { header: 'Trays', render: (d) => indFmt(d.trays) },
    { header: 'Lines', render: (d) => indFmt(d.lines) },
    { header: 'Units', render: (d) => indFmt(d.units) },
  ], { rank: true }));

  // Page 2: Highest Day drill-down
  if (r.highestDay) {
    const hd = r.highestDay;
    const perChecker = hd.checkers > 0 ? Math.round(hd.lines / hd.checkers) : 0;
    const unitsPerChecker = hd.checkers > 0 ? Math.round(hd.units / hd.checkers) : 0;
    out.push(dxPageBreak());
    out.push(dxHeaderBlock(r.reportDate));
    out.push(...dxSectionHeading(
      `HIGHEST DAY · ${fmtDayShort(hd.date)} · WEEKLY`,
      `Highest line day - ${fmtDayShort(hd.date)}`,
      `${fmtDayShort(hd.date)} was the highest line-item day this week, with ${hd.checkers} checker(s) on the floor across ${indFmt(hd.trays)} tray(s).`,
    ));
    out.push(dxKpiRow([
      { value: indFmt(hd.lines), label: `${fmtDayShort(hd.date)}'s lines` },
      { value: indFmt(hd.units), label: `${fmtDayShort(hd.date)}'s units` },
      { value: String(hd.checkers), label: 'Checkers on floor' },
      { value: indFmt(hd.trays), label: 'Trays / GPs' },
    ]));
    out.push(dxGap());
    out.push(dxStatRow([
      { value: indFmt(perChecker), label: 'Lines / checker' },
      { value: indFmt(unitsPerChecker), label: 'Units / checker' },
      { value: crFmt(hd.mrp), label: `${fmtDayShort(hd.date)}'s MRP` },
    ]));
    out.push(dxGap(220));
    out.push(dxBanner(`${fmtDayShort(hd.date).toUpperCase()} IN ONE LINE`, [
      { text: `${fmtDayShort(hd.date)} produced ` },
      { text: `${indFmt(hd.lines)} lines`, bold: true },
      { text: ' and ' },
      { text: `${indFmt(hd.units)} units`, bold: true },
      { text: " - the week's peak. " },
      { text: `${hd.checkers} checkers`, bold: true },
      { text: ' were on the floor across ' },
      { text: `${indFmt(hd.trays)} trays`, bold: true },
      { text: ', averaging ' },
      { text: `${indFmt(perChecker)} lines/checker`, bold: true },
      { text: ' and ' },
      { text: `${indFmt(unitsPerChecker)} units/checker`, bold: true },
      { text: ' for the day, worth roughly ' },
      { text: crFmt(hd.mrp), bold: true },
      { text: ' in MRP value.' },
    ]));
  }

  // Page 3: Scanner metrics
  if (r.fastestScanners.length > 0) {
    out.push(dxPageBreak());
    out.push(dxHeaderBlock(r.reportDate));
    out.push(...dxSectionHeading(
      'HARDWARE THROUGHPUT · WEEK',
      'Scanner based metrics',
      `${s.activeScanners} scanner(s) were active this week. Avg is each scanner's week-long throughput; Peak is its single best day.`,
    ));
    out.push(dxH2('Fastest scanners'));
    out.push(dxSecNote('Top 10, ranked by average items/min this week.'));
    out.push(...dxTable(r.fastestScanners.slice(0, 10), [
      { header: 'Scanner', render: (x) => x.scannerName },
      { header: 'Lines', render: (x) => indFmt(x.lines) },
      { header: 'Units', render: (x) => indFmt(x.units) },
      { header: 'Items/min', render: (x) => x.avgItemsPerMin },
      { header: 'Units/min', render: (x) => x.avgUnitsPerMin },
    ], { rank: true }));
    if (r.stations.length > 0) {
      out.push(dxH2('Station units - this week'));
      out.push(dxSecNote('Stations group 5 scanners each (Station 1 = Scanners 1-5, and so on). Total units scanned by each station this week.'));
      const maxU = Math.max(1, ...r.stations.map((st) => st.units));
      const minU = Math.min(...r.stations.map((st) => st.units));
      out.push(dxBarChart(r.stations.map((st) => ({ label: `S${st.station}`, value: st.units, valueLabel: indFmt(st.units), peak: st.units === minU }))));
    }
    out.push(dxH2('All scanners - this week'));
    out.push(dxSecNote('Every scanner used this week, with who operated it and MRP handled.'));
    out.push(...dxTable([...r.fastestScanners].sort((a, b) => (a.scannerName || '').localeCompare(b.scannerName || '', undefined, { numeric: true })), [
      { header: 'Scanner', render: (x) => x.scannerName },
      { header: 'Checkers operated', render: (x) => x.checkersOperated },
      { header: 'Lines', render: (x) => indFmt(x.lines) },
      { header: 'Units', render: (x) => indFmt(x.units) },
      { header: 'MRP', render: (x) => crFmt(x.mrp) },
    ]));
    if (r.topPicklists && r.topPicklists.length > 0) {
      out.push(dxH2('Top 10 picklists'));
      out.push(dxSecNote("Ranked by a combined score of line-item count, items/min and units/min (each normalized against the week's best, then averaged)."));
      out.push(...dxTable(r.topPicklists, [
        { header: 'Picklist', render: (x) => x.picklistNumber },
        { header: 'Lines', render: (x) => indFmt(x.lines) },
        { header: 'Units', render: (x) => indFmt(x.units) },
        { header: 'Items/min', render: (x) => x.itemsPerMin },
        { header: 'Units/min', render: (x) => x.unitsPerMin },
        { header: 'Score', render: (x) => x.score },
      ], { rank: true }));
    }
  }

  // Page 4: Personal best day
  if (r.checkerSummary.bestLineDayChecker || r.checkerSummary.bestUnitDayChecker) {
    const bl = r.checkerSummary.bestLineDayChecker, bu = r.checkerSummary.bestUnitDayChecker;
    out.push(dxPageBreak());
    out.push(dxHeaderBlock(r.reportDate));
    out.push(...dxSectionHeading(
      'PEOPLE · PERSONAL BEST DAY',
      'Highest lines/checker/day - and units',
      "One person's best single operating day this week - not the floor average.",
    ));
    const kpis = [];
    if (bl) kpis.push({ value: indFmt(bl.lines), label: 'Best single day · lines/checker/day', sub: `${bl.checkerName} · ${fmtDayShort(bl.date)}` });
    if (bu) kpis.push({ value: indFmt(bu.units), label: 'Best single day · units/checker/day', sub: `${bu.checkerName} · ${fmtDayShort(bu.date)}` });
    out.push(dxKpiRow(kpis));
    out.push(dxH2('Top personal line-item days'));
    out.push(dxSecNote('Each row is one checker on one day.'));
    out.push(...dxTable(r.topLinesDays, [
      { header: 'Day', render: (d) => fmtDayShort(d.date) },
      { header: 'Checker', render: (d) => d.checkerName },
      { header: 'Lines', render: (d) => indFmt(d.lines) },
    ], { rank: true }));
    out.push(dxH2('Top personal unit days'));
    out.push(...dxTable(r.topUnitsDays, [
      { header: 'Day', render: (d) => fmtDayShort(d.date) },
      { header: 'Checker', render: (d) => d.checkerName },
      { header: 'Units', render: (d) => indFmt(d.units) },
    ], { rank: true }));
  }

  // Page 5: Checker analysis
  if (r.highestVolumeCheckers.length > 0) {
    const cs = r.checkerSummary;
    out.push(dxPageBreak());
    out.push(dxHeaderBlock(r.reportDate));
    out.push(...dxSectionHeading(
      'PEOPLE · WEEKLY',
      `Checker analysis - Week of ${weekLabel}`,
      `${cs.checkersSeen} checker(s) scanned at some point this week, with a daily average of ${s.avgCheckersPerDay} checkers on the floor.`,
    ));
    const kpis5 = [];
    if (cs.bestLineDayChecker) kpis5.push({ value: indFmt(cs.bestLineDayChecker.lines), label: 'Best single day · lines/checker/day', sub: cs.bestLineDayChecker.checkerName });
    if (cs.bestUnitDayChecker) kpis5.push({ value: indFmt(cs.bestUnitDayChecker.units), label: 'Best single day · units/checker/day', sub: cs.bestUnitDayChecker.checkerName });
    kpis5.push({ value: indFmt(cs.avgLinesPerCheckerDay), label: 'Avg lines/checker/day', sub: 'This week' });
    kpis5.push({ value: indFmt(cs.avgUnitsPerCheckerDay), label: 'Avg units/checker/day', sub: 'This week' });
    out.push(dxKpiRow(kpis5));
    out.push(dxGap());
    out.push(dxStatRow([
      { value: String(cs.checkersSeen), label: 'Checkers seen' },
      { value: String(cs.presentAllDays), label: `Present all ${s.operationalDays} days` },
      { value: String(s.avgCheckersPerDay), label: 'Avg on floor' },
    ]));
    if (r.bench.length > 0) {
      out.push(dxH2('Bench breakdown'));
      out.push(dxSecNote("Total lines/units are the week sum for that bench. Averages are each person's lines (or units) divided by the days they scanned."));
      out.push(...dxTable(r.bench, [
        { header: 'Bench', render: (b) => b.label },
        { header: 'Total lines', render: (b) => indFmt(b.lines) },
        { header: 'Avg lines/checker/day', render: (b) => indFmt(b.avgLinesPerDay) },
        { header: 'Total units', render: (b) => indFmt(b.units) },
        { header: 'Avg units/checker/day', render: (b) => indFmt(b.avgUnitsPerDay) },
        { header: 'Share of lines', render: (b) => (typeof b.shareOfLines === 'number' ? b.shareOfLines + '%' : b.shareOfLines) },
      ]));
    }
    out.push(dxH2('Fastest checkers - average items/min'));
    out.push(dxSecNote('Top 10 among checkers present at least a few days this week, ranked by average items/min.'));
    out.push(...dxTable(r.fastestCheckers.slice(0, 10), [
      { header: 'Checker', render: (c) => c.checkerName },
      { header: 'Days', render: (c) => c.days },
      { header: 'Items/min', render: (c) => c.itemsPerMin },
      { header: 'Units/min', render: (c) => c.unitsPerMin },
    ], { rank: true }));
    out.push(dxH2('Highest weekly volume'));
    out.push(dxSecNote('Ranked by total lines checked this week. MRP and active scan time together show how much value each checker handled and how long it actually took them.'));
    out.push(...dxTable(r.highestVolumeCheckers, [
      { header: 'Checker', render: (c) => c.checkerName },
      { header: 'Days', render: (c) => c.days },
      { header: 'Lines', render: (c) => indFmt(c.lines) },
      { header: 'Units', render: (c) => indFmt(c.units) },
      { header: 'Lines/day', render: (c) => indFmt(c.linesPerDay) },
      { header: 'MRP', render: (c) => crFmt(c.mrp) },
      { header: 'Active scan time', render: (c) => c.activeScanTime },
    ], { rank: true }));
  }

  return out;
}

function buildDailyDocxSections(r) {
  const cov = r.coverage, wl = r.workload;
  const out = [];
  out.push(dxHeaderBlock(r.reportDate));
  out.push(...dxSectionHeading(null, `Report for ${r.schema}`, `Operational scanning performance across ${r.summary.picklists} picklists on ${r.reportDate}.`));
  out.push(dxStatBoxRow([
    { value: String(r.summary.picklists), label: 'PICKLISTS' },
    { value: String(r.summary.lineItems), label: 'LINE ITEMS' },
    { value: r.summary.totalUnits.toLocaleString(), label: 'TOTAL UNITS' },
    { value: r.summary.activeScanTime, label: 'ACTIVE SCAN TIME' },
    { value: `${r.summary.itemsPerMin} /min`, label: 'LINE ITEMS / MIN' },
    { value: `${r.summary.unitsPerMin} /min`, label: 'UNITS / MIN' },
  ]));
  out.push(dxGap(180));
  out.push(dxBullet([{ text: 'Highest Items / min → ' }, { text: `${r.summary.highestItemsPerMin} items / min`, bold: true, color: DX.ink }]));
  out.push(dxBullet([{ text: 'Highest Units / min → ' }, { text: `${r.summary.highestUnitsPerMin} units / min`, bold: true, color: DX.ink }]));

  out.push(dxH2('Picklist Details'));
  out.push(...dxTable(r.picklists, [
    { header: 'Picklist Number', render: (p) => p.picklistNumber },
    { header: 'Line items', render: (p) => p.lineItems },
    { header: 'Total Unit', render: (p) => p.totalUnit.toLocaleString() },
    { header: 'Scan Time', render: (p) => p.scanTime },
    { header: 'Line item/ Min', render: (p) => p.itemsPerMin },
    { header: 'units/ min', render: (p) => p.unitsPerMin },
  ], { rank: true, padRank: false }));
  if (r.picklists.length > 0) {
    out.push(dxPara(`TOTAL: ${r.summary.lineItems} line items, ${r.summary.totalUnits.toLocaleString()} units, ${r.summary.activeScanTime} active scan time, ${r.summary.itemsPerMin} items/min, ${r.summary.unitsPerMin} units/min.`, { bold: true, color: DX.ink, size: 17, spacing: { before: 100 } }));
  }

  out.push(dxH2('Scanner metrics'));
  out.push(...dxTable(r.scannerMetrics, [
    { header: 'Scanner name', render: (x) => x.scannerName || x.deviceId },
    { header: 'Checker name', render: (x) => x.checkerName },
    { header: 'Total Units', render: (x) => x.totalUnits.toLocaleString() },
    { header: 'Line Items', render: (x) => x.lineItems },
    { header: 'Scan Time', render: (x) => x.scanTime },
    { header: 'Units / Min', render: (x) => x.unitsPerMin },
    { header: 'Line Items / Min', render: (x) => x.itemsPerMin },
  ], { rank: true, padRank: false, rightAlignFrom: 3 }));

  out.push(dxH2('Scanning Coverage'));
  out.push(...dxTable([
    { m: 'Total Lines Assigned', v: cov.totalLinesAssigned.toLocaleString() },
    { m: 'Lines Completed', v: cov.linesCompleted.toLocaleString() },
    { m: 'Remaining Lines', v: cov.remainingLines.toLocaleString() },
    { m: 'Completed Percentage', v: `${cov.lineCoveragePct}%` },
  ], [{ header: 'Metric', render: (x) => x.m }, { header: 'Lines', render: (x) => x.v }]));
  out.push(dxBullet([{ text: `${cov.totalLinesAssigned.toLocaleString()} total lines were assigned at ${r.schema} today, of which ${cov.linesCompleted.toLocaleString()} lines were completed using Zander Checking App, achieving ${cov.lineCoveragePct}% line coverage.` }]));

  out.push(dxH2('Performance Highlights'));
  out.push(dxBullet([{ text: `${cov.picklistsCompleted} picklists were completed today; ${cov.picklistsAssigned - cov.picklistsCompleted} more remain assigned or checked.` }]));
  out.push(dxBullet([{ text: `${r.summary.activeScanTime} of total active scan time was recorded on completed picklists.` }]));
  out.push(dxBullet([{ text: 'Overall throughput was ' }, { text: `${r.summary.unitsPerMin} units/minute`, bold: true, color: DX.ink }, { text: '.' }]));
  out.push(dxBullet([{ text: 'Overall line-item processing rate was ' }, { text: `${r.summary.itemsPerMin} line items/minute`, bold: true, color: DX.ink }, { text: '.' }]));
  if (wl.largestPicklist) out.push(dxBullet([{ text: 'The largest individual picklist contained ' }, { text: `${wl.largestPicklist.units.toLocaleString()} units`, bold: true, color: DX.ink }, { text: ` (${wl.largestPicklist.picklistNumber}).` }]));

  out.push(dxH2('Workload Profile'));
  out.push(dxLabelValueRow([
    { label: 'LARGEST PICKLIST', value: wl.largestPicklist ? wl.largestPicklist.picklistNumber : '-', accent: true, sub: wl.largestPicklist ? `${wl.largestPicklist.units.toLocaleString()} units` : '' },
    { label: 'HIGHEST LINE-ITEM COUNT', value: wl.mostLineItems ? wl.mostLineItems.picklistNumber : '-', accent: true, sub: wl.mostLineItems ? `${wl.mostLineItems.lineItems} line items` : '' },
  ]));

  out.push(dxH2('Session Configuration'));
  out.push(dxLabelValueRow([
    { label: 'SCANNERS', value: String(r.scannerMetrics.length) },
    { label: 'PICKLISTS', value: `${cov.picklistsCompleted} completed / ${cov.picklistsAssigned} assigned` },
    { label: 'REPORT DATE', value: r.reportDate },
  ]));
  out.push(dxGap(100));
  out.push(dxLabelValueRow([
    { label: 'LOCATION / CUSTOMER', value: r.schema },
    { label: 'SCAN TIME', value: 'Active scanning time only; idle periods excluded.' },
  ]));
  out.push(dxGap(200));
  out.push(dxFooter('Zander · Supply Chain Intelligence', `${r.schema} Scan Report | ${r.reportDate}`));

  return out;
}

async function exportSheetAsDocx(filename) {
  const doc = new docx.Document({
    sections: [{
      properties: { page: { margin: { top: 720, bottom: 720, left: 720, right: 720 } } },
      children: buildDailyDocxSections(loadedDailyData),
    }],
  });
  triggerBlobDownload(await docx.Packer.toBlob(doc), filename);
}

async function exportWeeklyDocx(filename) {
  const doc = new docx.Document({
    sections: [{
      properties: { page: { margin: { top: 720, bottom: 720, left: 720, right: 720 } } },
      children: buildWeeklyDocxSections(loadedWeeklyData),
    }],
  });
  triggerBlobDownload(await docx.Packer.toBlob(doc), filename);
}

async function downloadDocx() {
  const dateLabel = (loadedReportDate || 'today').replace(/[^0-9A-Za-z-]/g, '_');
  if (currentReportKind === 'weekly') {
    await exportWeeklyDocx(`scan-report-weekly-${dateLabel}.docx`);
  } else {
    await exportSheetAsDocx(`scan-report-${dateLabel}.docx`);
  }
}
